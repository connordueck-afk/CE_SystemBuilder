<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -72 52 144">
  <defs>
    <linearGradient id="body" x1="0" y1="-72" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#181c22"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="-24" y="-70" width="48" height="140" rx="6" fill="url(#body)" stroke="#c98518" stroke-width="1.5"/>

  <!-- Top edge highlight -->
  <rect x="-22" y="-69" width="44" height="3" rx="1.5" fill="#3a3e45" opacity="0.5"/>

  <!-- Input terminals (top edge) -->
  <circle cx="-13" cy="-70" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <circle cx="0" cy="-70" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <circle cx="13" cy="-70" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>

  <!-- Input labels -->
  <text x="-13" y="-60" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 1</text>
  <text x="0" y="-60" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 2</text>
  <text x="13" y="-60" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 3</text>

  <!-- Output terminal (bottom edge) -->
  <circle cx="0" cy="70" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <text x="0" y="60" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">OUT</text>

  <!-- Label -->
  <text x="0" y="1" text-anchor="middle" font-size="7" font-family="sans-serif" font-weight="700" fill="#c98518">PV BRANCH</text>
  <text x="0" y="10" text-anchor="middle" font-size="7" font-family="sans-serif" font-weight="700" fill="#c98518">3:1</text>
</svg>
