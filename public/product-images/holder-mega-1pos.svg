<svg xmlns="http://www.w3.org/2000/svg" width="92" height="40" viewBox="0 0 92 40" role="img" aria-label="MEGA Fuse Holder 1-Position, Littelfuse modular style, with MEGA fuse installed">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#383d44"/>
      <stop offset="100%" stop-color="#16181b"/>
    </linearGradient>
    <radialGradient id="boss" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4a4f57"/>
      <stop offset="55%" stop-color="#2c2f34"/>
      <stop offset="100%" stop-color="#131417"/>
    </radialGradient>
    <linearGradient id="studMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f2"/>
      <stop offset="45%" stop-color="#b7bcc2"/>
      <stop offset="100%" stop-color="#82878d"/>
    </linearGradient>
    <linearGradient id="clearCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c3ccd2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8f979d" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="fuseGlimpse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3574a"/>
      <stop offset="100%" stop-color="#8f1f17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9"/>
      <feOffset dx="0" dy="0.6" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.35"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- modular black plastic housing -->
    <rect x="4" y="6" width="84" height="28" rx="9" fill="url(#plastic)"/>
    <rect x="4" y="6" width="84" height="6" rx="4" fill="#4a4f57" opacity="0.3"/>
    <!-- terminal bosses -->
    <circle cx="20" cy="20" r="14" fill="url(#boss)" stroke="#0d0e10" stroke-width="1"/>
    <circle cx="72" cy="20" r="14" fill="url(#boss)" stroke="#0d0e10" stroke-width="1"/>
    <!-- fuse element glimpsed through the clear polycarbonate cover -->
    <rect x="42" y="13" width="12" height="14" rx="2" fill="url(#fuseGlimpse)"/>
    <rect x="38" y="10" width="20" height="20" rx="6" fill="url(#clearCover)" stroke="#c9d2d8" stroke-width="0.6" stroke-opacity="0.5"/>
    <path d="M40,12 L46,12 L41,28 L38,28 Z" fill="#ffffff" opacity="0.18"/>
    <!-- terminal studs -->
    <g transform="translate(20,20)">
      <polygon points="0,-8 6.93,-4 6.93,4 0,8 -6.93,4 -6.93,-4" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.6"/>
      <circle r="3.4" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="1.3" fill="#232323"/>
    </g>
    <g transform="translate(72,20)">
      <polygon points="0,-8 6.93,-4 6.93,4 0,8 -6.93,4 -6.93,-4" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.6"/>
      <circle r="3.4" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="1.3" fill="#232323"/>
    </g>
  </g>
</svg>
