    <line x1="238" y1="124" x2="265" y2="124" stroke="#F0F4F5" stroke-width="1.2" opacity="0.55"/>
    <line x1="238" y1="128" x2="280" y2="128" stroke="#F0F4F5" stroke-width="1.2" opacity="0.55"/>
