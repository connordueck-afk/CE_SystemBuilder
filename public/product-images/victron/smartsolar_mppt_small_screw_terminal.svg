<svg xmlns="http://www.w3.org/2000/svg" width="218" height="328" viewBox="147 78 218 328" role="img" aria-label="smartsolar_mppt_small_screw_terminal">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088C7"/>
      <stop offset="100%" stop-color="#0096D6"/>
