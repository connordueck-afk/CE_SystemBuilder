    <rect x="222" y="366" width="4" height="8" fill="#22C55E" opacity="0.8"/>
    <line x1="224" y1="368" x2="224" y2="372" stroke="#1D2428" stroke-width="1.2"/>
    <line x1="189" y1="378" x2="197" y2="378" stroke="#F0F4F5" stroke-width="0.8" opacity="0.5"/>
    <!-- BAT output - line-cross (no text) -->
    <rect x="253" y="364" width="54" height="12" rx="3" fill="#1D2428" opacity="0.8"/>
    <rect x="286" y="366" width="4" height="8" fill="#F28C28" opacity="0.8"/>
    <line x1="288" y1="368" x2="288" y2="372" stroke="#1D2428" stroke-width="1.2"/>
    <line x1="253" y1="378" x2="261" y2="378" stroke="#F0F4F5" stroke-width="0.8" opacity="0.5"/>
    <!-- VE.Direct port -->
    <rect x="193" y="362" width="30" height="14" rx="3" fill="#0B0E10" stroke="#3B4348" stroke-width="0.7"/>
    <rect x="197" y="366" width="8" height="6" rx="1" fill="#1D2428"/>
    <line x1="201" y1="368" x2="201" y2="370" stroke="#5A6368" stroke-width="0.7"/>
    <line x1="197" y1="369" x2="205" y2="369" stroke="#5A6368" stroke-width="0.6"/>
