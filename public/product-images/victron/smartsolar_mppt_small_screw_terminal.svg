    <circle cx="289" cy="347" r="4.5" fill="#2A3238"/>
    <line x1="284" y1="347" x2="294" y2="347" stroke="#5A6368" stroke-width="1.2"/>
    <circle cx="330" cy="347" r="9" fill="#1A1F23" stroke="#3B4348" stroke-width="1.2"/>
    <circle cx="330" cy="347" r="4.5" fill="#2A3238"/>
    <line x1="325" y1="347" x2="335" y2="347" stroke="#5A6368" stroke-width="1.2"/>
