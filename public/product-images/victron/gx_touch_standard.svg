<svg xmlns="http://www.w3.org/2000/svg" width="278" height="198" viewBox="117 157 278 198" role="img" aria-label="gx_touch_standard">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g id="product" filter="url(#shadow)">
    <rect x="131" y="171" width="250" height="170" rx="16" fill="#111417"/>
    <rect x="149" y="189" width="214" height="134" rx="8" fill="#0096D6"/>
    <rect x="173" y="219" width="166" height="74" rx="8" fill="#13242C"/>
    <circle cx="345" cy="203" r="8" fill="#57D7FF"/>
  </g>
</svg>
