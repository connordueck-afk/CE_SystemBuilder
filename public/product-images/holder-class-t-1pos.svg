<svg xmlns="http://www.w3.org/2000/svg" width="150" height="60" viewBox="0 0 150 60" role="img" aria-label="Class T Fuse Holder 1-Position with Class T fuse installed">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d434c"/>
      <stop offset="100%" stop-color="#181b1f"/>
    </linearGradient>
    <linearGradient id="studMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f2"/>
      <stop offset="45%" stop-color="#b7bcc2"/>
      <stop offset="100%" stop-color="#82878d"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4d3ad"/>
      <stop offset="55%" stop-color="#c7a96f"/>
      <stop offset="100%" stop-color="#9c7c46"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6e8ea"/>
      <stop offset="100%" stop-color="#a5aab0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="8" y="10" width="44" height="40" rx="6" fill="url(#body)"/>
    <rect x="8" y="10" width="44" height="4" rx="2" fill="#5c626b" opacity="0.5"/>
    <circle cx="16" cy="18" r="1.5" fill="#0c0e10"/>
    <circle cx="44" cy="18" r="1.5" fill="#0c0e10"/>
    <circle cx="16" cy="42" r="1.5" fill="#0c0e10"/>
    <circle cx="44" cy="42" r="1.5" fill="#0c0e10"/>
    <rect x="98" y="10" width="44" height="40" rx="6" fill="url(#body)"/>
    <rect x="98" y="10" width="44" height="4" rx="2" fill="#5c626b" opacity="0.5"/>
    <circle cx="106" cy="18" r="1.5" fill="#0c0e10"/>
    <circle cx="134" cy="18" r="1.5" fill="#0c0e10"/>
    <circle cx="106" cy="42" r="1.5" fill="#0c0e10"/>
    <circle cx="134" cy="42" r="1.5" fill="#0c0e10"/>
    <!-- silver blade tabs -->
    <rect x="46" y="24" width="10" height="12" fill="url(#blade)"/>
    <rect x="94" y="24" width="10" height="12" fill="url(#blade)"/>
    <!-- ceramic Class T fuse body -->
    <rect x="52" y="15" width="46" height="30" rx="4" fill="url(#ceramic)" stroke="#7a5f38" stroke-width="0.6"/>
    <rect x="60" y="26" width="30" height="8" rx="1.5" fill="#7a2318" opacity="0.75"/>
    <!-- terminal studs -->
    <g transform="translate(30,30)">
      <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.6"/>
      <circle r="3.8" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="1.5" fill="#232323"/>
    </g>
    <g transform="translate(120,30)">
      <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.6"/>
      <circle r="3.8" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="1.5" fill="#232323"/>
    </g>
    <text x="30" y="56" font-family="Arial, sans-serif" font-size="6" fill="#7d848c" text-anchor="middle">IN+</text>
    <text x="120" y="56" font-family="Arial, sans-serif" font-size="6" fill="#7d848c" text-anchor="middle">OUT+</text>
  </g>
</svg>
