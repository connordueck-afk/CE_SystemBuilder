<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -50 140 100">
  <defs>
    <linearGradient id="body" x1="0" y1="-50" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#181c22"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="-68" y="-48" width="136" height="96" rx="6" fill="url(#body)" stroke="#c98518" stroke-width="1.5"/>

  <!-- Top edge highlight -->
  <rect x="-66" y="-47" width="132" height="3" rx="1.5" fill="#3a3e45" opacity="0.5"/>

  <!-- Left side — string input block -->
  <rect x="-70" y="-38" width="14" height="76" rx="3" fill="#1a1e25" stroke="#c98518" stroke-width="0.8"/>

  <!-- Right side — combined output block -->
  <rect x="56" y="-22" width="14" height="44" rx="3" fill="#1a1e25" stroke="#c98518" stroke-width="0.8"/>

  <!-- Output terminals (right edge) -->
  <circle cx="70" cy="-10" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <circle cx="70" cy="10" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>

  <!-- Output labels -->
  <text x="60" y="-10" text-anchor="end" font-size="5" font-family="sans-serif" fill="#8899aa">OUT+</text>
  <text x="60" y="10" text-anchor="end" font-size="5" font-family="sans-serif" fill="#8899aa">OUT-</text>

  <!-- Label -->
  <text x="0" y="1" text-anchor="middle" font-size="7" font-family="sans-serif" font-weight="700" fill="#c98518">PV COMBINER</text>
</svg>
