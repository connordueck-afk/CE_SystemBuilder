<svg xmlns="http://www.w3.org/2000/svg" width="70" height="32" viewBox="0 0 70 32" role="img" aria-label="MIDI Fuse Holder 1-Position, Littelfuse modular style, with MIDI fuse installed">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#383d44"/>
      <stop offset="100%" stop-color="#16181b"/>
    </linearGradient>
    <radialGradient id="boss" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4a4f57"/>
      <stop offset="55%" stop-color="#2c2f34"/>
      <stop offset="100%" stop-color="#131417"/>
    </radialGradient>
    <linearGradient id="studMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f2"/>
      <stop offset="45%" stop-color="#b7bcc2"/>
      <stop offset="100%" stop-color="#82878d"/>
    </linearGradient>
    <linearGradient id="clearCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c3ccd2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8f979d" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="fuseGlimpse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eb9a3e"/>
      <stop offset="100%" stop-color="#8a4a10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- modular black plastic housing -->
    <rect x="3" y="4" width="64" height="24" rx="7" fill="url(#plastic)"/>
    <rect x="3" y="4" width="64" height="5" rx="3" fill="#4a4f57" opacity="0.3"/>
    <!-- terminal bosses -->
    <circle cx="15" cy="16" r="11" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.8"/>
    <circle cx="55" cy="16" r="11" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.8"/>
    <!-- fuse element glimpsed through the clear polycarbonate cover -->
    <rect x="32" y="9.5" width="9" height="13" rx="1.5" fill="url(#fuseGlimpse)"/>
    <rect x="29" y="7.5" width="15" height="17" rx="4.5" fill="url(#clearCover)" stroke="#c9d2d8" stroke-width="0.5" stroke-opacity="0.5"/>
    <path d="M30,9 L34,9 L31,23 L29,23 Z" fill="#ffffff" opacity="0.18"/>
    <!-- terminal studs -->
    <g transform="translate(15,16)">
      <polygon points="0,-6.3 5.46,-3.15 5.46,3.15 0,6.3 -5.46,3.15 -5.46,-3.15" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.45"/>
      <circle r="2.6" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.35"/>
      <circle r="1" fill="#232323"/>
    </g>
    <g transform="translate(55,16)">
      <polygon points="0,-6.3 5.46,-3.15 5.46,3.15 0,6.3 -5.46,3.15 -5.46,-3.15" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.45"/>
      <circle r="2.6" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.35"/>
      <circle r="1" fill="#232323"/>
    </g>
  </g>
</svg>
