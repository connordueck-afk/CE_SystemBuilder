<svg xmlns="http://www.w3.org/2000/svg" width="130" height="50" viewBox="0 0 130 50" role="img" aria-label="ANL Fuse Holder 1-Position with ANL fuse installed">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d434c"/>
      <stop offset="100%" stop-color="#181b1f"/>
    </linearGradient>
    <linearGradient id="studMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f2"/>
      <stop offset="45%" stop-color="#b7bcc2"/>
      <stop offset="100%" stop-color="#82878d"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3dd97"/>
      <stop offset="50%" stop-color="#c9a344"/>
      <stop offset="100%" stop-color="#8a6a1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="0.8" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.35"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- left terminal block -->
    <rect x="6" y="8" width="34" height="34" rx="5" fill="url(#body)"/>
    <rect x="6" y="8" width="34" height="4" rx="2" fill="#5c626b" opacity="0.5"/>
    <circle cx="13" cy="15" r="1.3" fill="#0c0e10"/>
    <circle cx="33" cy="15" r="1.3" fill="#0c0e10"/>
    <circle cx="13" cy="35" r="1.3" fill="#0c0e10"/>
    <circle cx="33" cy="35" r="1.3" fill="#0c0e10"/>
    <!-- right terminal block -->
    <rect x="90" y="8" width="34" height="34" rx="5" fill="url(#body)"/>
    <rect x="90" y="8" width="34" height="4" rx="2" fill="#5c626b" opacity="0.5"/>
    <circle cx="97" cy="15" r="1.3" fill="#0c0e10"/>
    <circle cx="117" cy="15" r="1.3" fill="#0c0e10"/>
    <circle cx="97" cy="35" r="1.3" fill="#0c0e10"/>
    <circle cx="117" cy="35" r="1.3" fill="#0c0e10"/>
    <!-- brass ANL fuse blade -->
    <rect x="38" y="18" width="54" height="14" rx="2" fill="url(#brass)" stroke="#6b5117" stroke-width="0.5"/>
    <rect x="56" y="20.5" width="18" height="9" rx="1.5" fill="#2a1f0a" opacity="0.5"/>
    <circle cx="45" cy="25" r="1.7" fill="#7a5c1c"/>
    <circle cx="85" cy="25" r="1.7" fill="#7a5c1c"/>
    <!-- terminal studs -->
    <g transform="translate(23,25)">
      <polygon points="0,-8 6.93,-4 6.93,4 0,8 -6.93,4 -6.93,-4" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.6"/>
      <circle r="3.4" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="1.3" fill="#232323"/>
    </g>
    <g transform="translate(107,25)">
      <polygon points="0,-8 6.93,-4 6.93,4 0,8 -6.93,4 -6.93,-4" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.6"/>
      <circle r="3.4" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="1.3" fill="#232323"/>
    </g>
    <text x="23" y="47" font-family="Arial, sans-serif" font-size="5.5" fill="#7d848c" text-anchor="middle">IN+</text>
    <text x="107" y="47" font-family="Arial, sans-serif" font-size="5.5" fill="#7d848c" text-anchor="middle">OUT+</text>
  </g>
</svg>
