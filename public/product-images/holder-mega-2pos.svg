<svg xmlns="http://www.w3.org/2000/svg" width="140" height="70" viewBox="0 0 140 70" role="img" aria-label="MEGA Fuse Holder 2-Position, Littelfuse modular style, with MEGA fuses installed">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#383d44"/>
      <stop offset="100%" stop-color="#16181b"/>
    </linearGradient>
    <radialGradient id="boss" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4a4f57"/>
      <stop offset="55%" stop-color="#2c2f34"/>
      <stop offset="100%" stop-color="#131417"/>
    </radialGradient>
    <linearGradient id="studMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0f2"/>
      <stop offset="45%" stop-color="#b7bcc2"/>
      <stop offset="100%" stop-color="#82878d"/>
    </linearGradient>
    <linearGradient id="clearCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c3ccd2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8f979d" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="fuseGlimpse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3574a"/>
      <stop offset="100%" stop-color="#8f1f17"/>
    </linearGradient>
    <linearGradient id="busCopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d99a5c"/>
      <stop offset="50%" stop-color="#a5652a"/>
      <stop offset="100%" stop-color="#6e3f16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="0.8" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.35"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="6" y="6" width="128" height="58" rx="8" fill="url(#plastic)"/>
    <rect x="6" y="6" width="128" height="5" rx="3" fill="#4a4f57" opacity="0.25"/>

    <!-- shared positive bus -->
    <rect x="20" y="17" width="92" height="6" rx="3" fill="url(#busCopper)"/>
    <!-- fuse cavity 1 -->
    <rect x="38" y="8" width="32" height="24" rx="6" fill="url(#plastic)"/>
    <rect x="44" y="12" width="10" height="16" rx="2" fill="url(#fuseGlimpse)"/>
    <rect x="41" y="10" width="16" height="20" rx="5" fill="url(#clearCover)" stroke="#c9d2d8" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- fuse cavity 2 -->
    <rect x="80" y="8" width="32" height="24" rx="6" fill="url(#plastic)"/>
    <rect x="86" y="12" width="10" height="16" rx="2" fill="url(#fuseGlimpse)"/>
    <rect x="83" y="10" width="16" height="20" rx="5" fill="url(#clearCover)" stroke="#c9d2d8" stroke-width="0.5" stroke-opacity="0.5"/>

    <!-- shared negative bus -->
    <rect x="20" y="44" width="92" height="12" rx="3" fill="url(#busCopper)"/>

    <!-- positive input boss -->
    <circle cx="20" cy="20" r="11" fill="url(#boss)" stroke="#0d0e10" stroke-width="1"/>
    <g transform="translate(20,20)">
      <polygon points="0,-7.5 6.5,-3.75 6.5,3.75 0,7.5 -6.5,3.75 -6.5,-3.75" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.55"/>
      <circle r="3.1" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.4"/>
      <circle r="1.15" fill="#232323"/>
    </g>
    <!-- fuse output bosses -->
    <circle cx="64" cy="20" r="9" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.9"/>
    <g transform="translate(64,20)">
      <polygon points="0,-6.5 5.63,-3.25 5.63,3.25 0,6.5 -5.63,3.25 -5.63,-3.25" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="2.7" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.4"/>
      <circle r="1" fill="#232323"/>
    </g>
    <circle cx="106" cy="20" r="9" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.9"/>
    <g transform="translate(106,20)">
      <polygon points="0,-6.5 5.63,-3.25 5.63,3.25 0,6.5 -5.63,3.25 -5.63,-3.25" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="2.7" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.4"/>
      <circle r="1" fill="#232323"/>
    </g>
    <!-- negative bus studs -->
    <circle cx="20" cy="50" r="8" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.9"/>
    <g transform="translate(20,50)">
      <polygon points="0,-6.5 5.63,-3.25 5.63,3.25 0,6.5 -5.63,3.25 -5.63,-3.25" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="2.7" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.4"/>
      <circle r="1" fill="#232323"/>
    </g>
    <circle cx="64" cy="50" r="8" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.9"/>
    <g transform="translate(64,50)">
      <polygon points="0,-6.5 5.63,-3.25 5.63,3.25 0,6.5 -5.63,3.25 -5.63,-3.25" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="2.7" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.4"/>
      <circle r="1" fill="#232323"/>
    </g>
    <circle cx="106" cy="50" r="8" fill="url(#boss)" stroke="#0d0e10" stroke-width="0.9"/>
    <g transform="translate(106,50)">
      <polygon points="0,-6.5 5.63,-3.25 5.63,3.25 0,6.5 -5.63,3.25 -5.63,-3.25" fill="url(#studMetal)" stroke="#5c5c5c" stroke-width="0.5"/>
      <circle r="2.7" fill="#8f9298" stroke="#5c5c5c" stroke-width="0.4"/>
      <circle r="1" fill="#232323"/>
    </g>
  </g>
</svg>
