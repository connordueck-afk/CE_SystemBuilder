<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -38 120 76">
  <defs>
    <linearGradient id="body" x1="0" y1="-38" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#181c22"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="-57" y="-36" width="114" height="72" rx="6" fill="url(#body)" stroke="#c98518" stroke-width="1.5"/>

  <!-- Top edge highlight -->
  <rect x="-55" y="-35" width="110" height="3" rx="1.5" fill="#3a3e45" opacity="0.5"/>

  <!-- Input terminals (top edge) -->
  <circle cx="-36" cy="-36" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <circle cx="-12" cy="-36" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <circle cx="12" cy="-36" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <circle cx="36" cy="-36" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>

  <!-- Input labels -->
  <text x="-36" y="-26" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 1</text>
  <text x="-12" y="-26" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 2</text>
  <text x="12" y="-26" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 3</text>
  <text x="36" y="-26" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">IN 4</text>

  <!-- Output terminal (bottom edge) -->
  <circle cx="0" cy="36" r="3.5" fill="#1a1e25" stroke="#c98518" stroke-width="1.2"/>
  <text x="0" y="26" text-anchor="middle" font-size="5" font-family="sans-serif" fill="#8899aa">OUT</text>

  <!-- Label -->
  <text x="0" y="1" text-anchor="middle" font-size="7" font-family="sans-serif" font-weight="700" fill="#c98518">PV BRANCH 4:1</text>
</svg>
