<svg xmlns="http://www.w3.org/2000/svg" width="260" height="390" viewBox="0 0 260 390" role="img" aria-label="BlueSolar MPPT Charge Controller">
  <defs>
    <filter id="shadow" x="-10%" y="-8%" width="120%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- Body blue gradient -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004A80"/>
      <stop offset="15%" stop-color="#005A9C"/>
      <stop offset="50%" stop-color="#006AB5"/>
      <stop offset="85%" stop-color="#005A9C"/>
      <stop offset="100%" stop-color="#004A80"/>
    </linearGradient>

    <!-- Terminal block gradient (dark grey plastic) -->
    <linearGradient id="termGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1D20"/>
      <stop offset="50%" stop-color="#24282C"/>
      <stop offset="100%" stop-color="#1A1D20"/>
    </linearGradient>

    <!-- Fin highlight -->
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0080CC" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#005A9C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#003355" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- ===== Blue aluminum extruded body ===== -->
    <rect x="20" y="10" width="220" height="370" rx="4" fill="url(#bodyGrad)"/>
    <rect x="20" y="10" width="220" height="370" rx="4" fill="none" stroke="#0077C4" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Left side vertical fin ridges (extruded heatsink) -->
    <rect x="22" y="12" width="10" height="366" rx="2" fill="url(#finGrad)"/>
    <rect x="35" y="12" width="8" height="366" rx="1.5" fill="url(#finGrad)"/>

    <!-- Right side vertical fin ridges -->
    <rect x="228" y="12" width="10" height="366" rx="2" fill="url(#finGrad)"/>
    <rect x="215" y="12" width="8" height="366" rx="1.5" fill="url(#finGrad)"/>

    <!-- Top lip of extrusion -->
    <rect x="45" y="10" width="170" height="4" rx="1" fill="#004D85" opacity="0.5"/>

    <!-- ===== Front face silkscreen content ===== -->
    <!-- All original white text replaced with white bars -->

    <!-- Top branding: "victron energy" -->
    <rect x="85" y="32" width="90" height="7" rx="2" fill="#FFFFFF" opacity="0.82"/>
    <!-- "BLUE POWER" -->
    <rect x="95" y="46" width="70" height="5" rx="1.5" fill="#FFFFFF" opacity="0.62"/>

    <!-- Separator gap -->

    <!-- Model line: "BlueSolar charge controller" -->
    <rect x="58" y="72" width="144" height="7" rx="2" fill="#FFFFFF" opacity="0.78"/>
    <!-- "MPPT" -->
    <rect x="103" y="86" width="54" height="7" rx="2" fill="#FFFFFF" opacity="0.72"/>

    <!-- Thin horizontal rule -->
    <line x1="55" y1="108" x2="205" y2="108" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.25"/>

    <!-- ===== LED status indicators ===== -->
    <!-- Three LEDs stacked on the right side with label text on the left -->

    <!-- Row 1: Green LED (Float) -->
    <!-- "Green LED" bar -->
    <rect x="58" y="124" width="48" height="4.5" rx="1" fill="#FFFFFF" opacity="0.58"/>
    <!-- "|" separator bar -->
    <rect x="112" y="124" width="3" height="4.5" rx="0.5" fill="#FFFFFF" opacity="0.4"/>
    <!-- "Float" bar -->
    <rect x="121" y="124" width="26" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>
    <!-- Green LED circle -->
    <circle cx="195" cy="127" r="5.5" fill="#15181A" stroke="#3A3E42" stroke-width="0.8"/>
    <circle cx="195" cy="127" r="3" fill="#22C55E" opacity="0.88"/>

    <!-- Row 2: Yellow LED (Absorption) -->
    <!-- "Yellow LED" bar -->
    <rect x="58" y="152" width="52" height="4.5" rx="1" fill="#FFFFFF" opacity="0.58"/>
    <!-- "|" separator bar -->
    <rect x="116" y="152" width="3" height="4.5" rx="0.5" fill="#FFFFFF" opacity="0.4"/>
    <!-- "Absorption" bar -->
    <rect x="125" y="152" width="44" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>
    <!-- Yellow LED circle -->
    <circle cx="195" cy="155" r="5.5" fill="#15181A" stroke="#3A3E42" stroke-width="0.8"/>
    <circle cx="195" cy="155" r="3" fill="#EAB308" opacity="0.88"/>

    <!-- Row 3: Blue LED (Bulk) -->
    <!-- "Blue LED" bar -->
    <rect x="58" y="180" width="42" height="4.5" rx="1" fill="#FFFFFF" opacity="0.58"/>
    <!-- "|" separator bar -->
    <rect x="106" y="180" width="3" height="4.5" rx="0.5" fill="#FFFFFF" opacity="0.4"/>
    <!-- "Bulk" bar -->
    <rect x="115" y="180" width="24" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>
    <!-- Blue LED circle -->
    <circle cx="195" cy="183" r="5.5" fill="#15181A" stroke="#3A3E42" stroke-width="0.8"/>
    <circle cx="195" cy="183" r="3" fill="#3B82F6" opacity="0.88"/>

    <!-- Divider before terminal block -->
    <line x1="40" y1="210" x2="220" y2="210" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- ===== Terminal block (raised dark plastic housing) ===== -->
    <!-- Housing body -->
    <rect x="34" y="222" width="192" height="148" rx="3" fill="url(#termGrad)"/>
    <rect x="34" y="222" width="192" height="148" rx="3" fill="none" stroke="#111315" stroke-width="1"/>
    <!-- Top edge highlight -->
    <rect x="36" y="224" width="188" height="2" rx="1" fill="#3A3E42" opacity="0.4"/>

    <!-- Terminal recessed area -->
    <rect x="50" y="236" width="160" height="124" rx="2" fill="#0E1012" stroke="#1A1C20" stroke-width="0.8"/>

    <!-- === BATT section === -->
    <!-- BATT label -->
    <rect x="62" y="246" width="36" height="6" rx="1.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- BATT + terminal housing -->
    <rect x="116" y="240" width="22" height="22" rx="2" fill="#15181A" stroke="#2A2E32" stroke-width="0.8"/>
    <circle cx="127" cy="251" r="5.5" fill="#B88632" stroke="#8A6420" stroke-width="0.5"/>
    <line x1="127" y1="247" x2="127" y2="255" stroke="#8A6420" stroke-width="1.2"/>
    <line x1="123" y1="251" x2="131" y2="251" stroke="#8A6420" stroke-width="1.2"/>
    <!-- + label -->
    <rect x="119" y="264" width="16" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>

    <!-- BATT - terminal housing -->
    <rect x="146" y="240" width="22" height="22" rx="2" fill="#15181A" stroke="#2A2E32" stroke-width="0.8"/>
    <circle cx="157" cy="251" r="5.5" fill="#B88632" stroke="#8A6420" stroke-width="0.5"/>
    <line x1="153" y1="251" x2="161" y2="251" stroke="#8A6420" stroke-width="1.2"/>
    <!-- - label -->
    <rect x="150" y="264" width="14" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>

    <!-- === PV section === -->
    <!-- PV label -->
    <rect x="62" y="280" width="20" height="6" rx="1.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- PV + terminal housing -->
    <rect x="116" y="274" width="22" height="22" rx="2" fill="#15181A" stroke="#2A2E32" stroke-width="0.8"/>
    <circle cx="127" cy="285" r="5.5" fill="#B88632" stroke="#8A6420" stroke-width="0.5"/>
    <line x1="127" y1="281" x2="127" y2="289" stroke="#8A6420" stroke-width="1.2"/>
    <line x1="123" y1="285" x2="131" y2="285" stroke="#8A6420" stroke-width="1.2"/>
    <!-- + label -->
    <rect x="119" y="298" width="16" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>

    <!-- PV - terminal housing -->
    <rect x="146" y="274" width="22" height="22" rx="2" fill="#15181A" stroke="#2A2E32" stroke-width="0.8"/>
    <circle cx="157" cy="285" r="5.5" fill="#B88632" stroke="#8A6420" stroke-width="0.5"/>
    <line x1="153" y1="285" x2="161" y2="285" stroke="#8A6420" stroke-width="1.2"/>
    <!-- - label -->
    <rect x="150" y="298" width="14" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>

    <!-- === LOAD section === -->
    <!-- LOAD label -->
    <rect x="62" y="314" width="32" height="6" rx="1.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- LOAD + terminal housing -->
    <rect x="116" y="308" width="22" height="22" rx="2" fill="#15181A" stroke="#2A2E32" stroke-width="0.8"/>
    <circle cx="127" cy="319" r="5.5" fill="#B88632" stroke="#8A6420" stroke-width="0.5"/>
    <line x1="127" y1="315" x2="127" y2="323" stroke="#8A6420" stroke-width="1.2"/>
    <line x1="123" y1="319" x2="131" y2="319" stroke="#8A6420" stroke-width="1.2"/>
    <!-- + label -->
    <rect x="119" y="332" width="16" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>

    <!-- LOAD - terminal housing -->
    <rect x="146" y="308" width="22" height="22" rx="2" fill="#15181A" stroke="#2A2E32" stroke-width="0.8"/>
    <circle cx="157" cy="319" r="5.5" fill="#B88632" stroke="#8A6420" stroke-width="0.5"/>
    <line x1="153" y1="319" x2="161" y2="319" stroke="#8A6420" stroke-width="1.2"/>
    <!-- - label -->
    <rect x="150" y="332" width="14" height="4.5" rx="1" fill="#FFFFFF" opacity="0.48"/>

    <!-- Bottom edge of terminal block -->
    <rect x="34" y="366" width="192" height="4" rx="1" fill="#0A0C0E" opacity="0.5"/>
  </g>
</svg>
